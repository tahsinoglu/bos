<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Matvuu</title>
<meta name="description" content="Kurban hisse ve bağış afişlerini kolayca hazırla, isimleri ekle, PNG/JPEG olarak indir." />
<meta name="theme-color" content="#5a32fa" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2300c4cc'/%3E%3Cstop offset='1' stop-color='%237d2ae8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cg fill='%23fff'%3E%3Crect x='14' y='14' width='10' height='10' rx='3'/%3E%3Crect x='27' y='14' width='10' height='10' rx='3'/%3E%3Crect x='40' y='14' width='10' height='10' rx='3' opacity='.5'/%3E%3Crect x='14' y='27' width='10' height='10' rx='3'/%3E%3Crect x='27' y='27' width='10' height='10' rx='3' opacity='.5'/%3E%3Crect x='40' y='27' width='10' height='10' rx='3' opacity='.5'/%3E%3Crect x='14' y='44' width='36' height='6' rx='3'/%3E%3C/g%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=Nunito:wght@600;700;800;900&family=Oswald:wght@500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;0,800;1,400;1,700&display=swap" rel="stylesheet" />
<style>
:root{
  --purple:#8b3dff; --purple-d:#7731d8; --purple-t:#f1e9ff;
  --ink:#0e1318; --muted:#5f6772; --line:#e3e5e9; --soft:#f3f4f6;
  --stage:#e9eaee; --panel:#ffffff; --r:10px;
  --grad:linear-gradient(90deg,#00c4cc 0%,#5a32fa 62%,#7d2ae8 100%);
  --shadow:0 8px 30px rgba(14,19,24,.14);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--stage);color:var(--ink);font:14px/1.4 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{display:flex;flex-direction:column;height:100%}

/* ---------- Üst çubuk ---------- */
.topbar{height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 12px 0 14px;background:var(--grad);color:#fff;position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.brand-logo{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.tb-sep{width:1px;height:24px;background:rgba(255,255,255,.3)}
.tb-btn{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:#fff;transition:background .15s,opacity .15s}
.tb-btn:hover{background:rgba(255,255,255,.16)}
.tb-btn:disabled{opacity:.4;cursor:default;background:none}
#docName{background:transparent;border:1px solid transparent;color:#fff;border-radius:7px;padding:6px 9px;width:210px;font-weight:600;outline:none;transition:border-color .15s,background .15s}
#docName:hover{border-color:rgba(255,255,255,.45)}
#docName:focus{border-color:#fff;background:rgba(255,255,255,.1)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.btn{height:38px;padding:0 16px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;transition:transform .12s,background .15s,box-shadow .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.glass{background:rgba(255,255,255,.18);color:#fff}
.btn.glass:hover{background:rgba(255,255,255,.28)}
.btn.white{background:#fff;color:var(--ink)}
.btn.white:hover{box-shadow:0 4px 14px rgba(0,0,0,.18)}
.btn.primary{background:var(--purple);color:#fff}
.btn.primary:hover{background:var(--purple-d)}
.btn.light{background:var(--soft);color:var(--ink)}
.btn.light:hover{background:#e8e9ec}
.btn.block{width:100%}
.btn.sm{height:32px;padding:0 12px;font-size:13px}

.dl-wrap{position:relative}
.dl-menu{position:absolute;right:0;top:46px;width:300px;background:#fff;color:var(--ink);border-radius:12px;box-shadow:var(--shadow);padding:16px;opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top right;pointer-events:none;transition:opacity .16s,transform .16s}
.dl-menu.open{opacity:1;transform:none;pointer-events:auto}
.dl-menu h4{margin:0 0 12px;font-size:15px}
.dl-menu .field{margin-bottom:14px}

/* ---------- Gövde ---------- */
.body{flex:1;display:flex;min-height:0;position:relative}
.rail{width:76px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:stretch;padding:8px 6px;gap:2px;z-index:20;overflow-y:auto}
.rail button{height:62px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11px;font-weight:600;color:var(--muted);transition:background .15s,color .15s}
.rail button .ico{width:36px;height:30px;border-radius:8px;display:grid;place-items:center;transition:background .15s,transform .15s}
.rail button:hover{color:var(--ink)}
.rail button:hover .ico{background:var(--soft)}
.rail button.active{color:var(--purple)}
.rail button.active .ico{background:var(--purple-t);transform:scale(1.04)}

.panel{width:340px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;transition:margin-left .25s ease,opacity .2s;z-index:15}
.panel.closed{margin-left:-340px;opacity:0;pointer-events:none}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px}
.panel-head h2{margin:0;font-size:16px;font-weight:700}
.panel-x{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.panel-x:hover{background:var(--soft);color:var(--ink)}
.sheet-handle{display:none}
.panel-body{flex:1;overflow-y:auto;padding:6px 16px 28px}
.panel-body.enter{animation:pIn .28s ease}
@keyframes pIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}

/* ---------- Form öğeleri ---------- */
.sec{margin:18px 0 8px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sec:first-child{margin-top:6px}
.field{margin-bottom:12px}
.field>label,.lbl{display:block;font-size:12.5px;font-weight:600;color:#3b424b;margin-bottom:6px}
.inp,textarea.inp{width:100%;height:40px;border:1px solid #d5d8dd;border-radius:8px;padding:0 12px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
textarea.inp{height:auto;min-height:64px;padding:10px 12px;resize:vertical;line-height:1.4}
.inp:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(139,61,255,.16)}
.suffix{position:relative}
.suffix .inp{padding-right:36px}
.suffix span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.stepper{display:flex;align-items:center;border:1px solid #d5d8dd;border-radius:8px;height:40px;overflow:hidden;background:#fff}
.stepper button{width:38px;height:100%;display:grid;place-items:center;color:var(--muted);transition:background .12s}
.stepper button:hover{background:var(--soft);color:var(--ink)}
.stepper input{flex:1;min-width:0;border:0;text-align:center;outline:none;height:100%;font-weight:600;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper.sm{height:34px;width:104px;flex:none}
.stepper.sm button{width:30px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{height:28px;padding:0 11px;border-radius:99px;background:var(--soft);font-size:12.5px;font-weight:600;color:#3b424b;transition:background .15s,color .15s}
.chip:hover{background:#e7e8eb}
.chip.on{background:var(--purple-t);color:var(--purple)}
.seg{display:flex;background:var(--soft);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;height:32px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted);transition:background .18s,color .18s,box-shadow .18s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;cursor:pointer;font-weight:500}
.tog input{display:none}
.tog .sw{width:38px;height:22px;border-radius:99px;background:#cfd3d9;position:relative;transition:background .2s;flex:none}
.tog .sw::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.tog input:checked+.sw{background:var(--purple)}
.tog input:checked+.sw::after{transform:translateX(16px)}
.info{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:4px 0 6px}
.info div{background:var(--soft);border-radius:9px;padding:9px 8px;text-align:center}
.info b{display:block;font-size:14px}
.info small{color:var(--muted);font-size:11px;font-weight:600}
.note{font-size:12px;color:var(--muted);margin:6px 0 0}
.warn{background:#fff4e5;color:#8a4b00;border-radius:8px;padding:8px 10px;font-size:12.5px;margin:8px 0}

/* Şablonlar */
.tpls{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tpl{display:flex;flex-direction:column;gap:6px;text-align:left}
.tpl .th{border-radius:10px;overflow:hidden;border:2px solid transparent;outline:1px solid var(--line);transition:transform .18s,box-shadow .18s,border-color .18s;background:#fff;line-height:0}
.tpl canvas{width:100%;height:auto;display:block}
.tpl:hover .th{transform:translateY(-3px);box-shadow:0 8px 18px rgba(0,0,0,.12)}
.tpl.on .th{border-color:var(--purple);outline-color:transparent}
.tpl span{font-size:12.5px;font-weight:600}

/* Boyut */
.fmts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fmt{border:1.5px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;transition:border-color .15s,background .15s,transform .15s}
.fmt:hover{transform:translateY(-2px)}
.fmt.on{border-color:var(--purple);background:var(--purple-t)}
.fmt i{display:block;background:linear-gradient(135deg,#d9dbe0,#c4c8cf);border-radius:4px}
.fmt.on i{background:linear-gradient(135deg,#b88cff,#8b3dff)}
.fmt b{font-size:13px}
.fmt small{color:var(--muted);font-size:11.5px}

/* Renkler */
.pals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pal{border:1.5px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,transform .15s}
.pal:hover{transform:translateY(-2px)}
.pal.on{border-color:var(--purple)}
.pal .dots{display:flex;height:28px;border-radius:7px;overflow:hidden}
.pal .dots i{flex:1}
.pal span{font-size:12px;font-weight:600;text-align:left}
.cpick{display:flex;align-items:center;gap:10px;padding:7px 0}
.cpick label{flex:1;font-weight:500}
.cpick .sw2{position:relative;width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);overflow:hidden;flex:none}
.cpick input[type=color]{position:absolute;inset:-10px;width:60px;height:60px;border:0;padding:0;cursor:pointer;opacity:0}
.cpick code{font-size:12px;color:var(--muted);width:66px;text-align:right}

/* Logo */
.drop{border:2px dashed #cfd3d9;border-radius:12px;padding:22px 14px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;display:block}
.drop:hover,.drop.over{border-color:var(--purple);background:var(--purple-t)}
.drop b{display:block;margin:8px 0 2px}
.drop small{color:var(--muted)}
.logo-prev{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:12px;padding:10px;margin-top:10px}
.logo-prev img{width:64px;height:64px;object-fit:contain;background:#fff;border-radius:8px}
input[type=range]{width:100%;accent-color:var(--purple)}

/* Hissedarlar */
.adder{background:var(--soft);border-radius:12px;padding:12px;margin-bottom:10px}
.adder .row{margin-top:8px}
.prog{margin:12px 0 4px}
.prog .bar{height:8px;border-radius:99px;background:#e6e7ea;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .35s ease}
.prog .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;font-weight:600}
.dlist{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.dlist li{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 6px 6px 10px;animation:liIn .25s ease}
@keyframes liIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.dlist .no{font-size:11px;color:var(--muted);font-weight:700;width:18px;flex:none}
.dlist input.nm{flex:1;min-width:0;border:0;outline:none;font-weight:600;padding:6px 0;background:transparent}
.dlist .del{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--muted);flex:none}
.dlist .del:hover{background:#fde8e8;color:#d33}
.empty{color:var(--muted);text-align:center;padding:18px 8px;font-size:13px}
details.bulk{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
details.bulk summary{cursor:pointer;font-weight:600}
details.bulk textarea{margin-top:10px;min-height:110px}

/* ---------- Sahne ---------- */
.stage{flex:1;min-width:0;position:relative;overflow:auto;display:flex}
.cwrap{margin:auto;padding:28px 28px 84px}
#cv{display:block;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.08),0 12px 40px rgba(0,0,0,.12);border-radius:2px}
#cv.swap{animation:swap .35s ease}
@keyframes swap{from{opacity:.35;transform:scale(.985)}to{opacity:1;transform:none}}
.sbar{position:fixed;right:18px;bottom:16px;display:flex;align-items:center;gap:10px;background:#fff;border-radius:99px;padding:6px 8px 6px 14px;box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:10;font-size:12.5px;font-weight:600;color:var(--muted)}
.sbar input{width:110px}
.sbar .pill{background:var(--soft);border-radius:99px;padding:5px 10px;color:var(--ink)}
.sbar button{height:28px;padding:0 10px;border-radius:99px;font-weight:600}
.sbar button:hover{background:var(--soft)}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#1c2026;color:#fff;padding:11px 18px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.busy{position:fixed;inset:0;background:rgba(255,255,255,.55);display:none;place-items:center;z-index:90;backdrop-filter:blur(2px)}
.busy.show{display:grid}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--purple-t);border-top-color:var(--purple);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- Mobil ---------- */
@media (max-width: 820px){
  .topbar{height:52px;gap:6px;padding:0 8px 0 10px}
  .brand span.t,#docName,.tb-sep,.hide-m{display:none}
  .btn{padding:0 12px}
  .body{flex-direction:column}
  .rail{position:fixed;left:0;right:0;bottom:0;width:auto;height:calc(64px + env(safe-area-inset-bottom));padding:4px 4px calc(4px + env(safe-area-inset-bottom));flex-direction:row;border-right:0;border-top:1px solid var(--line);overflow-x:auto;overflow-y:hidden;z-index:40}
  .rail button{flex:1 0 50px;height:56px;font-size:10.5px}
  .panel{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));width:auto;height:min(60vh,560px);border-right:0;border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.16);transform:translateY(0);transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .2s;z-index:35}
  .panel.closed{margin-left:0;transform:translateY(calc(100% + 80px));opacity:1}
  .sheet-handle{display:block;width:40px;height:5px;border-radius:9px;background:#d4d7dc;margin:8px auto 0}
  .panel-head{padding:8px 16px 4px}
  .cwrap{padding:16px 16px 150px}
  .sbar{bottom:calc(76px + env(safe-area-inset-bottom));right:50%;transform:translateX(50%)}
  .sbar input{width:90px}
  .dl-menu{position:fixed;left:10px;right:10px;top:58px;width:auto}
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="brand-logo" id="brandLogo"></span><span class="t">Matvuu</span></div>
    <span class="tb-sep"></span>
    <button class="tb-btn" id="undo" title="Geri al (Ctrl+Z)"></button>
    <button class="tb-btn" id="redo" title="Yinele (Ctrl+Y)"></button>
    <input id="docName" spellcheck="false" aria-label="Tasarım adı" />
    <div class="tb-right">
      <button class="btn glass" id="shareBtn"><span id="shareIco"></span><span class="hide-m">Paylaş</span></button>
      <div class="dl-wrap">
        <button class="btn white" id="dlBtn"><span id="dlIco"></span>İndir</button>
        <div class="dl-menu" id="dlMenu">
          <h4>Görseli indir</h4>
          <div class="field"><span class="lbl">Dosya türü</span>
            <div class="seg" id="dlType"><button data-v="png" class="on">PNG</button><button data-v="jpg">JPEG</button></div>
          </div>
          <div class="field"><span class="lbl">Kalite</span>
            <div class="seg" id="dlQ"><button data-v="norm" class="on">Normal</button><button data-v="hi">Yüksek / Baskı</button></div>
            <p class="note" id="dlDims"></p>
          </div>
          <button class="btn primary block" id="dlGo">İndir</button>
        </div>
      </div>
    </div>
  </header>

  <div class="body">
    <nav class="rail" id="rail"></nav>
    <section class="panel" id="panel">
      <div class="sheet-handle"></div>
      <div class="panel-head"><h2 id="panelTitle"></h2><button class="panel-x" id="panelX" title="Paneli kapat"></button></div>
      <div class="panel-body" id="pb"></div>
    </section>
    <main class="stage" id="stage">
      <div class="cwrap"><canvas id="cv"></canvas></div>
    </main>
  </div>
  <div class="sbar">
    <span class="pill" id="fmtLbl">A4</span>
    <input type="range" id="zoom" min="40" max="200" value="100" aria-label="Yakınlaştırma" />
    <span id="zoomLbl">%100</span>
    <button id="fitBtn">Sığdır</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="busy" id="busy"><div class="spin"></div></div>
<input type="file" id="logoFile" accept="image/*" hidden />

<script>
"use strict";
/* =====================================================================
   Matvuu — kurban hisse / bağış afişi hazırlayıcı
   Tek dosya, derleme gerektirmez. Afiş tamamen <canvas> üzerine çizilir;
   önizleme ve dışa aktarma aynı çizim fonksiyonunu kullanır.
   ===================================================================== */

/* ---------------- İkonlar ---------------- */
const ICONS = {
  tpl:'<rect width="18" height="7" x="3" y="3" rx="1"/><rect width="9" height="7" x="3" y="14" rx="1"/><rect width="5" height="7" x="16" y="14" rx="1"/>',
  grid:'<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',

/* ---------------- Hesap ---------------- */
const MAX_CELLS = 600;
function stats(s){
  const total = Math.max(0, num(s.total)), box = Math.max(1, num(s.boxPrice) || 1), H = clamp(Math.round(num(s.hisse) || 1), 1, 14);
  const rawN = Math.max(1, Math.ceil(total / box - 1e-9)), N = Math.min(rawN, MAX_CELLS);
  const manual = s.gridMode === 'manual';
  const cap = manual ? clamp(Math.round(num(s.cols)), 1, 40) * clamp(Math.round(num(s.rows)), 1, 60) : N;
  const names = [];
  for (const d of s.donors){ const n = Math.max(0, Math.round(num(d.count))); const nm = (d.name || '').trim() || 'Hayır Sahibi'; for (let i = 0; i < n && names.length < 5000; i++) names.push(nm); }
  const filled = Math.min(names.length, cap);
  const collected = Math.min(total, filled * box);
  return { total, box, H, N, rawN, cap, names, filled, collected, pct: total ? collected / total : 0,
    remaining: Math.max(0, total - collected), hissePrice: total / H, perHisse: Math.ceil(N / H), overflow: Math.max(0, names.length - cap), manual };
}

function computeGrid(s, st, gw, gh, ratio){
  let cols, rows, sub = 1, groups = 0, per = 0;
  const score = (c, r, used) => Math.abs(Math.log(((gw / c) / (gh / r)) / ratio)) + (c * r - used) / used * 0.6;
  if (st.manual){
    cols = clamp(Math.round(num(s.cols)), 1, 40); rows = clamp(Math.round(num(s.rows)), 1, 60);
    if (st.H > 1 && cols % st.H === 0){ groups = st.H; sub = cols / st.H; per = sub * rows; }
  } else if (st.H > 1){
    groups = st.H; per = Math.ceil(st.N / st.H);
    let best = 1, bs = Infinity;
    for (let k = 1; k <= 8; k++){ const c = groups * k; if (c > 42) break; const r = Math.ceil(per / k); const sc = score(c, r, per * groups); if (sc < bs){ bs = sc; best = k; } }
    sub = best; cols = groups * sub; rows = Math.ceil(per / sub);
  } else {
    let best = 1, bs = Infinity;
    for (let c = 1; c <= Math.min(30, st.N); c++){ const r = Math.ceil(st.N / c); const sc = score(c, r, st.N); if (sc < bs){ bs = sc; best = c; } }
    cols = best; rows = Math.ceil(st.N / cols);
  }
  const order = [];
  if (groups){
    if (s.fillOrder === 'row'){
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++){ const lc = c % sub; if (lc * rows + r < per) order.push([c, r]); }
    } else {
      for (let g = 0; g < groups; g++) for (let lc = 0; lc < sub; lc++) for (let r = 0; r < rows; r++){ if (lc * rows + r < per) order.push([g * sub + lc, r]); }
    }
  } else {
    const n = st.manual ? cols * rows : st.N;
    if (s.fillOrder === 'row') for (let i = 0; i < n; i++) order.push([i % cols, Math.floor(i / cols)]);
    else for (let i = 0; i < n; i++) order.push([Math.floor(i / rows), i % rows]);
  }
  return { cols, rows, sub, groups, per, order };
}

function gridGeom(s, st, A, o){
  const numW = o.numColW || 0;
  const wantHead = s.showHeaders && o.headerH > 0;
  const G = computeGrid(s, st, A.w - numW, A.h - (wantHead ? o.headerH : 0), o.ratio || 2);
  const hH = wantHead && (G.groups || o.plainHeaders) ? o.headerH : 0;
  const gg = G.groups && G.sub > 1 ? (o.groupGap || 0) : 0, nGap = G.groups ? G.groups - 1 : 0;
  let cw = (A.w - numW - nGap * gg) / G.cols, ch = (A.h - hH) / G.rows;
  ch = Math.min(ch, o.maxCellH || 120, cw * 1.1);
  cw = Math.min(cw, ch * (o.maxRatio || 3.6), o.maxCellW || 300);
  const gw = cw * G.cols + nGap * gg + numW, gh = ch * G.rows + hH;
  const ox = A.x + (A.w - gw) / 2, oy = A.y + Math.max(0, (A.h - gh) / 2) * (o.vAlign ?? 0.5);
  return Object.assign(G, { cw, ch, gg, hH, ox, oy, gw, gh, numW,
    colX: c => ox + numW + c * cw + (G.groups ? Math.floor(c / G.sub) * gg : 0),
    rowY: r => oy + hH + r * ch });
}

function drawBoxes(ctx, s, st, A, o){

      const label = (s.headerPattern || '{n}').replace('{n}', g + 1);

  const gap = Math.max(2, Math.min(Gm.cw, Gm.ch) * (o.gap ?? 0.13));
  Gm.order.forEach(([col, row], i) => {
    const x = Gm.colX(col) + gap/2, y = Gm.rowY(row) + gap/2, w = Gm.cw - gap, h = Gm.ch - gap;
    const name = st.names[i], on = !!name;
    const lw = Math.max(1, Math.min(w, h) * (o.lw ?? 0.05));
    rr(ctx, x + lw/2, y + lw/2, w - lw, h - lw, Math.min(w, h) * (o.radius ?? 0.2));
    const fill = on ? o.fillOn : o.fillOff;
    if (fill){ ctx.fillStyle = fill; ctx.fill(); }
    const stroke = on ? (o.strokeOn ?? o.strokeOff) : o.strokeOff;
    if (stroke){ ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.setLineDash(!on && o.dash ? [lw * 2.4, lw * 1.8] : []); ctx.stroke(); ctx.setLineDash([]); }
    if (on) drawName(ctx, name, x + w/2, y + h/2, w * 0.9 - lw * 2, h * 0.84 - lw * 2, o.nameFont, o.textOn);
    else if (s.showNumbers){ ctx.font = o.numFont(Math.min(h * 0.34, w * 0.26, 22)); ctx.fillStyle = o.numColor; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(i + 1), x + w/2, y + h/2 + 1); }
  });
  return Gm;
}

/* Tablo ızgara (lacivert) */
function drawTable(ctx, s, st, A, c){
  const numW = s.showNumbers ? 46 : 0;
  const Gm = gridGeom(s, st, A, { ratio: 2.8, headerH: 46, groupGap: 0, numColW: numW, plainHeaders: true, maxCellH: 74, maxRatio: 7, maxCellW: 330, vAlign: 0.35 });
  const x0 = Gm.ox, y0 = Gm.oy, w = Gm.gw, h = Gm.gh, R = 16;
  ctx.save(); rr(ctx, x0, y0, w, h, R); ctx.fillStyle = rgba('#ffffff', .62); ctx.fill(); ctx.clip();
  if (Gm.hH){ const g = ctx.createLinearGradient(0, y0, 0, y0 + Gm.hH); g.addColorStop(0, mix(c.primary, '#000', .12)); g.addColorStop(1, c.primary); ctx.fillStyle = g; ctx.fillRect(x0, y0, w, Gm.hH); }
  const valid = new Set(Gm.order.map(([a, b]) => a + ',' + b));
  ctx.fillStyle = rgba(c.text, .07);
  for (let col = 0; col < Gm.cols; col++) for (let r = 0; r < Gm.rows; r++) if (!valid.has(col + ',' + r)) ctx.fillRect(Gm.colX(col), Gm.rowY(r), Gm.cw, Gm.ch);
  ctx.fillStyle = rgba(c.accent, .17);
  Gm.order.forEach(([col, r], i) => { if (st.names[i]) ctx.fillRect(Gm.colX(col), Gm.rowY(r), Gm.cw, Gm.ch); });
  ctx.strokeStyle = rgba(c.accent, .5); ctx.lineWidth = 1.2; ctx.beginPath();
  for (let r = 1; r < Gm.rows; r++){ const y = Gm.rowY(r); ctx.moveTo(x0, y); ctx.lineTo(x0 + w, y); }
  ctx.stroke();
  for (let col = 1; col < Gm.cols; col++){
    const x = Gm.colX(col), major = !Gm.groups || col % Gm.sub === 0;
    ctx.lineWidth = major ? 1.8 : 1; ctx.strokeStyle = rgba(c.accent, major ? .75 : .4);
    ctx.beginPath(); ctx.moveTo(x, major ? y0 : y0 + Gm.hH); ctx.lineTo(x, y0 + h); ctx.stroke();
  }
  if (numW){ ctx.lineWidth = 1.8; ctx.strokeStyle = rgba(c.accent, .75); ctx.beginPath(); ctx.moveTo(x0 + numW, y0); ctx.lineTo(x0 + numW, y0 + h); ctx.stroke(); }
  if (Gm.hH){ ctx.lineWidth = 2; ctx.strokeStyle = c.accent; ctx.beginPath(); ctx.moveTo(x0, y0 + Gm.hH); ctx.lineTo(x0 + w, y0 + Gm.hH); ctx.stroke(); }
  ctx.restore();
  rr(ctx, x0, y0, w, h, R); ctx.lineWidth = 2.5; ctx.strokeStyle = c.accent; ctx.stroke();
  if (Gm.hH){
    ctx.fillStyle = c.accent; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const draw = (x1, x2, t) => { ctx.font = `700 ${Math.min(24, Gm.hH * 0.48, (x2 - x1) * 0.22)}px "Playfair Display"`; ctx.fillText(t, (x1 + x2) / 2, y0 + Gm.hH / 2 + 1, x2 - x1 - 6); };
    if (Gm.groups) for (let g = 0; g < Gm.groups; g++) draw(Gm.colX(g * Gm.sub), Gm.colX(g * Gm.sub + Gm.sub - 1) + Gm.cw, (s.headerPattern || '{n}').replace('{n}', g + 1));
    else for (let col = 0; col < Gm.cols; col++) draw(Gm.colX(col), Gm.colX(col) + Gm.cw, money(s, st.box));
  }
  if (numW){
    ctx.fillStyle = c.primary; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `700 ${Math.min(22, Gm.ch * 0.5)}px "Playfair Display"`;
    for (let r = 0; r < Gm.rows; r++) ctx.fillText(String(r + 1), x0 + numW / 2, Gm.rowY(r) + Gm.ch / 2 + 1);
  }
  Gm.order.forEach(([col, r], i) => { const nm = st.names[i]; if (nm) drawName(ctx, nm, Gm.colX(col) + Gm.cw/2, Gm.rowY(r) + Gm.ch/2, Gm.cw * 0.88, Gm.ch * 0.8, z => `600 ${z}px Montserrat`, c.text); });
  return Gm;
}

/* Hedef çubuğu */
function drawProgress(ctx, s, st, x, y, w, o){
  ctx.textBaseline = 'alphabetic';
  ctx.font = o.titleFont; ctx.fillStyle = o.titleColor; ctx.textAlign = 'left'; ctx.fillText(s.progressTitle || '', x, y + 26, w * 0.7);
  ctx.textAlign = 'right'; ctx.font = o.pctFont; ctx.fillStyle = o.pctColor; ctx.fillText('%' + Math.floor(st.pct * 100), x + w, y + 28);
  const by = y + 40, bh = o.barH || 24;
  rr(ctx, x, by, w, bh, bh / 2); ctx.fillStyle = o.track; ctx.fill();
  if (o.trackStroke){ ctx.strokeStyle = o.trackStroke; ctx.lineWidth = 2; ctx.stroke(); }
  if (st.pct > 0){
    const fw = Math.max(bh, w * Math.min(1, st.pct)); rr(ctx, x, by, fw, bh, bh / 2);
    const g = ctx.createLinearGradient(x, 0, x + w, 0); g.addColorStop(0, o.fill1); g.addColorStop(1, o.fill2); ctx.fillStyle = g; ctx.fill();
    rr(ctx, x + bh * 0.3, by + 3, fw - bh * 0.6, bh * 0.32, bh * 0.16); ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.fill();
  }
  ctx.font = o.infoFont; ctx.fillStyle = o.infoColor; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  const info = st.pct >= 1 ? 'Hedefe ulaşıldı — Rabbim kabul eylesin!' : `Toplanan ${money(s, st.collected)}   •   Hedef ${money(s, st.total)}   •   Kalan ${money(s, st.remaining)}`;
  ctx.fillText(info, x + w / 2, by + bh + 32, w);
}

function drawGece(ctx, s, c, W, H, st){
  const bg = ctx.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, c.bg); bg.addColorStop(1, mix(c.bg, c.primary, .75));
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  ],
});
let S;
try { S = Object.assign(DEFAULT(), JSON.parse(localStorage.getItem(STORE_KEY) || 'null') || {}); } catch { S = DEFAULT(); }
if (!TEMPLATES[S.template]) S.template = 'klasik';
if (!FORMATS[S.format]) S.format = 'a4';

const save = debounce(() => {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); }
  catch { try { localStorage.setItem(STORE_KEY, JSON.stringify({ ...S, logo: null })); } catch {} }
}, 400);

let hist = [], hi = -1;
function commit(){ const j = JSON.stringify(S); if (hist[hi] === j) return; hist = hist.slice(0, hi + 1); hist.push(j); if (hist.length > 60) hist.shift(); hi = hist.length - 1; updUndo(); }
const commitLater = debounce(commit, 450);
function updUndo(){ $('#undo').disabled = hi <= 0; $('#redo').disabled = hi >= hist.length - 1; }
function restore(j){ S = JSON.parse(j); loadLogo(); renderPanel(); requestRender(true); save(); updUndo(); $('#docName').value = S.docName || ''; }
function undo(){ commit(); if (hi > 0){ hi--; restore(hist[hi]); } }
function redo(){ if (hi < hist.length - 1){ hi++; restore(hist[hi]); } }

function changed(opts = {}){ requestRender(opts.anim); save(); commitLater(); refreshDynamic(); }

function loadLogo(){
  if (!S.logo){ logoImg = null; return; }
  if (logoImg && logoImg.src === S.logo) return;
  logoImg = new Image(); logoImg.onload = () => { requestRender(); refreshThumbs(); }; logoImg.src = S.logo;
}

/* ===================== ÖNİZLEME ===================== */
const cv = $('#cv'), cctx = cv.getContext('2d'), stage = $('#stage');
let zoom = 1, raf = 0, last = null;
function requestRender(anim){
  if (anim){ cv.classList.remove('swap'); void cv.offsetWidth; cv.classList.add('swap'); }
  if (!raf) raf = requestAnimationFrame(() => { raf = 0; drawPreview(); });
}
function fitScale(){
  const f = FORMATS[S.format], mobile = innerWidth <= 820;
  const sw = stage.clientWidth - (mobile ? 32 : 56), sh = stage.clientHeight - (mobile ? 170 : 112);
  return Math.max(0.1, Math.min(sw / f.w, sh / f.h));
}
function drawPreview(){
  const f = FORMATS[S.format];
  const dw = Math.round(f.w * fitScale() * zoom), dh = Math.round(dw * f.h / f.w);
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const pw = Math.min(4000, Math.round(dw * dpr));
  cv.style.width = dw + 'px'; cv.style.height = dh + 'px';
  if (cv.width !== pw || cv.height !== Math.round(pw * f.h / f.w)){ cv.width = pw; cv.height = Math.round(pw * f.h / f.w); }
  cctx.setTransform(pw / f.w, 0, 0, pw / f.w, 0, 0);
  cctx.clearRect(0, 0, f.w, f.h);
  last = render(cctx, S, f.w, f.h);
  $('#fmtLbl').textContent = f.name;
  refreshDynamic();
}
new ResizeObserver(() => requestRender()).observe(stage);

    <div class="field" style="margin-top:14px"><label>Logo boyutu</label><input type="range" min="0.5" max="2" step="0.05" data-k="logoScale"></div>
    ${S.logo ? '' : tog('showEmblem', 'Logo yokken amblem göster')}
    <div class="sec">Kurum</div>
    ${fieldIn('orgName', 'Kurum / cami / dernek adı', 'KURUM ADI')}`,
  size: () => `<div class="fmts">${Object.entries(FORMATS).map(([id, f]) => { const h = 54, w = Math.round(h * f.w / f.h); return `<button class="fmt ${S.format === id ? 'on' : ''}" data-fmt="${id}"><i style="width:${w}px;height:${h}px"></i><b>${f.name}</b><small>${f.sub}</small></button>`; }).join('')}</div>
    <p class="note" style="margin-top:14px">WhatsApp durumunda A4 de güzel görünür; tam ekran için <b>Hikâye / Durum</b> boyutunu seç. Yazdırmak için A4 + <b>Yüksek / Baskı</b> kalitesiyle indir.</p>`,
};
const palOn = p => ['primary', 'accent', 'bg', 'text'].every(k => (S.colors[k] || '').toLowerCase() === p[k]);

const pb = $('#pb');
function renderPanel(anim){
  const t = TABS.find(x => x.id === tab);
  $('#panelTitle').textContent = t.title;
  const st = pb.scrollTop;
  pb.innerHTML = PANELS[tab]();
  pb.querySelectorAll('[data-k]').forEach(el => {
    const v = S[el.dataset.k];
    if (el.type === 'checkbox') el.checked = !!v; else el.value = v ?? '';
  });
  if (anim){ pb.classList.remove('enter'); void pb.offsetWidth; pb.classList.add('enter'); pb.scrollTop = 0; } else pb.scrollTop = st;
  document.querySelectorAll('#rail button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab && panelOpen));
  if (tab === 'tpl') refreshThumbs();
  if (tab === 'donors') renderDonors();
  refreshDynamic();
}
function setPanelOpen(o){ panelOpen = o; $('#panel').classList.toggle('closed', !o); document.querySelectorAll('#rail button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab && o)); setTimeout(() => requestRender(), 260); }

function refreshThumbs(){
  if (tab !== 'tpl') return;
  pb.querySelectorAll('canvas[data-thumb]').forEach(c => {
    const id = c.dataset.thumb, f = FORMATS[S.format], tw = 150, dpr = Math.min(devicePixelRatio || 1, 2);
    c.width = Math.round(tw * dpr); c.height = Math.round(c.width * f.h / f.w);
    const x = c.getContext('2d'); x.setTransform(c.width / f.w, 0, 0, c.width / f.w, 0, 0);
    render(x, { ...S, template: id, colors: { ...TEMPLATES[id].colors } }, f.w, f.h);
  });
}
const refreshThumbsLater = debounce(refreshThumbs, 300);

function refreshDynamic(){
  const st = stats(S);
  const info = $('#info');
  if (info){
    const g = last && last.Gm;
    info.innerHTML = `<div><b>${money(S, st.hissePrice)}</b><small>Hisse bedeli</small></div><div><b>${st.cap}</b><small>Toplam kutu</small></div><div><b>${g ? g.cols + '×' + g.rows : '-'}</b><small>Sütun × satır</small></div>`;
    $('#capWarn').innerHTML = st.rawN > MAX_CELLS && !st.manual ? `<div class="warn">Kutu sayısı çok fazla (${fmt(st.rawN)}). En fazla ${MAX_CELLS} kutu gösterilir; kutu bedelini artırman önerilir.</div>`
      : st.manual && st.cap * st.box < st.total ? `<div class="warn">Elle ayarlanan ${st.cap} kutu toplam bedelin ${money(S, st.cap * st.box)} kadarını karşılıyor.</div>` : '';
  }
  const bar = $('#pBar');
  if (bar){
    bar.style.width = Math.min(100, st.pct * 100) + '%';
    $('#pLeft').textContent = `${st.filled} / ${st.cap} kutu dolu`;
    $('#pRight').textContent = `${money(S, st.collected)} · %${Math.floor(st.pct * 100)}`;
    $('#dHisse').textContent = `Tam hisse (${st.perHisse} kutu)`;
    const cnt = Math.max(1, Math.round(num($('#dCount').value)));
    $('#dAmount').textContent = '= ' + money(S, cnt * st.box);
    $('#ovWarn').innerHTML = st.overflow ? `<div class="warn">${st.overflow} kutu afişe sığmadı. Toplam bedeli veya kutu sayısını artırabilirsin.</div>` : '';
  }
}

function renderDonors(){
  const ul = $('#dList'); if (!ul) return;
  if (!S.donors.length){ ul.innerHTML = `<li class="empty" style="border:0;background:none">Henüz isim yok. Yukarıdan ilk hissedarı ekle.</li>`; return; }
  ul.innerHTML = S.donors.map((d, i) => `<li data-id="${d.id}"><span class="no">${i + 1}</span><input class="nm" data-dn="${d.id}" value="${esc(d.name)}" aria-label="İsim"><div class="stepper sm"><button data-dinc="${d.id}:-1">${ic('minus', 14)}</button><input type="number" data-dc="${d.id}" value="${d.count}" min="0"><button data-dinc="${d.id}:1">${ic('plus', 14)}</button></div><button class="del" data-ddel="${d.id}" title="Sil">${ic('trash', 16)}</button></li>`).join('');
}
function addDonor(name, count){
  name = (name || '').trim(); if (!name) return false;
  S.donors.push({ id: uid(), name, count: Math.max(1, Math.round(count) || 1) });
  renderDonors(); changed(); return true;
}

/* ---------- Panel olayları ---------- */
const NUMERIC = new Set(['total', 'hisse', 'boxPrice', 'cols', 'rows', 'logoScale']);
pb.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.k){
    const k = el.dataset.k;
    S[k] = el.type === 'checkbox' ? el.checked : NUMERIC.has(k) ? num(el.value) : el.value;
    changed(); if (['total', 'hisse', 'boxPrice'].includes(k)) refreshThumbsLater();
  } else if (el.dataset.c){
    S.colors[el.dataset.c] = el.value;
    el.parentElement.style.background = el.value; el.closest('.cpick').querySelector('code').textContent = el.value;
    pb.querySelectorAll('.pal').forEach((b, i) => b.classList.toggle('on', palOn(PALETTES[i])));
    changed();
  } else if (el.dataset.dn){
    const d = S.donors.find(x => x.id === el.dataset.dn); if (d){ d.name = el.value; changed(); }
  } else if (el.dataset.dc){
    const d = S.donors.find(x => x.id === el.dataset.dc); if (d){ d.count = Math.max(0, Math.round(num(el.value))); changed(); }
  } else if (el.id === 'dCount') refreshDynamic();
});
pb.addEventListener('change', e => { if (e.target.dataset.k && ['hisse', 'cols', 'rows'].includes(e.target.dataset.k)) { const k = e.target.dataset.k; S[k] = Math.max(1, Math.round(num(S[k]))); e.target.value = S[k]; changed(); } });
pb.addEventListener('click', e => {
  const b = e.target.closest('button,[data-tpl],label.drop'); if (!b) return;
  const d = b.dataset;
  if (d.tpl){
    S.template = d.tpl; S.colors = { ...TEMPLATES[d.tpl].colors };
    pb.querySelectorAll('.tpl').forEach(x => x.classList.toggle('on', x.dataset.tpl === d.tpl));
    changed({ anim: true }); return;
  }
  if (d.fmt){ S.format = d.fmt; pb.querySelectorAll('.fmt').forEach(x => x.classList.toggle('on', x.dataset.fmt === d.fmt)); changed({ anim: true }); updDims(); return; }
  if (d.pal){ const p = PALETTES[+d.pal]; S.colors = { primary: p.primary, accent: p.accent, bg: p.bg, text: p.text }; renderPanel(); changed({ anim: true }); return; }
  if (d.set){ const [k, v] = d.set.split('='); if (k === 'gridMode' && v === 'manual' && S.gridMode !== 'manual' && last && last.Gm){ S.cols = last.Gm.cols; S.rows = last.Gm.rows; } S[k] = NUMERIC.has(k) ? num(v) : v; renderPanel(); changed(); return; }
  if (d.step){ const [k, dv] = d.step.split(':'); const inp = pb.querySelector(`[data-k="${k}"]`); const v = Math.round(num(S[k])) + (+dv); S[k] = clamp(v, +inp.min || 1, +inp.max || 999); inp.value = S[k]; changed(); return; }
  if (d.dstep){ const inp = $('#dCount'); inp.value = Math.max(1, Math.round(num(inp.value)) + (+d.dstep)); refreshDynamic(); return; }
  if (d.dinc){ const [id, dv] = d.dinc.split(':'); const x = S.donors.find(o => o.id === id); if (x){ x.count = Math.max(0, x.count + (+dv)); pb.querySelector(`[data-dc="${id}"]`).value = x.count; changed(); } return; }
  if (d.ddel){ const li = b.closest('li'); li.style.transition = 'opacity .18s, transform .18s'; li.style.opacity = 0; li.style.transform = 'translateX(12px)'; setTimeout(() => { S.donors = S.donors.filter(o => o.id !== d.ddel); renderDonors(); changed(); }, 170); return; }
  switch (b.id){
    case 'dAdd': { const n = $('#dName'); if (addDonor(n.value, num($('#dCount').value))){ n.value = ''; $('#dCount').value = 1; n.focus(); toast('Eklendi'); } else n.focus(); break; }
    case 'dHisse': { const n = $('#dName'); if (addDonor(n.value || 'Hayır Sahibi', stats(S).perHisse)){ n.value = ''; toast('Tam hisse eklendi'); } break; }
    case 'bulkAdd': {
      const lines = $('#bulkTxt').value.split('\n').map(l => l.trim()).filter(Boolean); let c = 0;
      for (const l of lines){ const m = l.match(/^(.*?)[\s,;:\-]*(?:x|×|\*)?\s*(\d+)\s*(?:kutu|adet)?$/i); const nm = m && m[1].trim() ? m[1].trim() : l; const cnt = m && m[1].trim() ? +m[2] : 1; S.donors.push({ id: uid(), name: nm, count: Math.max(1, cnt) }); c++; }
      if (c){ $('#bulkTxt').value = ''; renderDonors(); changed(); toast(c + ' kişi eklendi'); } break;
    }
    case 'dClear':
      if (!S.donors.length) break;
      if (b.dataset.arm !== '1'){ b.dataset.arm = '1'; b.lastChild.textContent = ' Emin misin? Silmek için tekrar dokun'; setTimeout(() => { if (b.isConnected){ b.dataset.arm = ''; b.lastChild.textContent = ' Tüm isimleri temizle'; } }, 3500); break; }
      S.donors = []; renderDonors(); changed(); toast('Liste temizlendi · Geri al ile geri getirebilirsin'); b.dataset.arm = ''; b.lastChild.textContent = ' Tüm isimleri temizle'; break;
    case 'resetColors': S.colors = { ...TEMPLATES[S.template].colors }; renderPanel(); changed({ anim: true }); break;
    case 'logoDel': S.logo = null; logoImg = null; renderPanel(); changed(); break;
  }
  if (b.id === 'drop'){ e.preventDefault(); $('#logoFile').click(); }
});
pb.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.target.id === 'dName' || e.target.id === 'dCount')){ e.preventDefault(); $('#dAdd').click(); } });
['dragover', 'dragleave', 'drop'].forEach(ev => pb.addEventListener(ev, e => {
  const dz = e.target.closest && e.target.closest('#drop'); if (!dz) return; e.preventDefault();
  dz.classList.toggle('over', ev === 'dragover');
  if (ev === 'drop' && e.dataTransfer.files[0]) readLogo(e.dataTransfer.files[0]);
}));
$('#logoFile').addEventListener('change', e => { if (e.target.files[0]) readLogo(e.target.files[0]); e.target.value = ''; });
function readLogo(file){
  if (!file.type.startsWith('image/')) return toast('Lütfen bir görsel seç');
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const m = 800, k = Math.min(1, m / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      S.logo = c.toDataURL('image/png'); loadLogo(); renderPanel(); changed(); toast('Logo eklendi');
    };
    img.onerror = () => toast('Görsel açılamadı');
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

/* ---------- Ray ---------- */
$('#rail').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]'); if (!b) return;
  if (b.dataset.tab === tab && panelOpen){ setPanelOpen(false); return; }
  tab = b.dataset.tab; if (!panelOpen) setPanelOpen(true); renderPanel(true);
});
$('#panelX').innerHTML = ic('left', 18);
$('#panelX').addEventListener('click', () => setPanelOpen(false));

/* ---------- Üst çubuk ---------- */
$('#brandLogo').innerHTML = ic('brand', 22);
$('#undo').innerHTML = ic('undo'); $('#redo').innerHTML = ic('redo');
$('#shareIco').innerHTML = ic('share', 18); $('#dlIco').innerHTML = ic('download', 18);
$('#undo').onclick = undo; $('#redo').onclick = redo;
const dn = $('#docName'); dn.value = S.docName || '';
dn.addEventListener('input', () => { S.docName = dn.value; save(); commitLater(); });
document.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey) || ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
  if (e.key.toLowerCase() === 'z' && !e.shiftKey){ e.preventDefault(); undo(); }
  else if (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey)){ e.preventDefault(); redo(); }
});

let dlType = 'png', dlQ = 'norm';
const dlMenu = $('#dlMenu');
function updDims(){ const f = FORMATS[S.format], k = f[dlQ]; $('#dlDims').textContent = `${Math.round(f.w * k)} × ${Math.round(f.h * k)} piksel`; }
$('#dlBtn').onclick = e => { e.stopPropagation(); updDims(); dlMenu.classList.toggle('open'); };
document.addEventListener('click', e => { if (!e.target.closest('.dl-wrap')) dlMenu.classList.remove('open'); });
[['#dlType', v => dlType = v], ['#dlQ', v => { dlQ = v; updDims(); }]].forEach(([sel, fn]) => $(sel).addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; $(sel).querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); fn(b.dataset.v);
}));

function makeBlob(type, q){
  const f = FORMATS[S.format], k = f[q];
  const c = document.createElement('canvas'); c.width = Math.round(f.w * k); c.height = Math.round(f.h * k);
  const x = c.getContext('2d'); x.setTransform(k, 0, 0, k, 0, 0);
  if (type === 'jpg'){ x.fillStyle = '#fff'; x.fillRect(0, 0, f.w, f.h); }
  render(x, S, f.w, f.h);
  return new Promise(res => c.toBlob(res, type === 'jpg' ? 'image/jpeg' : 'image/png', 0.93));
}
const fileName = ext => ((S.docName || 'afis').toLocaleLowerCase('tr-TR').replace(/[çğıöşü]/g, m => ({ç:'c',ğ:'g',ı:'i',ö:'o',ş:'s',ü:'u'}[m])).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'afis') + '.' + ext;
function busy(o){ $('#busy').classList.toggle('show', o); }
/* claude.ai içinde açıldıysa indirme platformun "downloads" yeteneğiyle yapılır */
const dlCapP = window.claude && window.claude.use ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);
async function saveBlob(blob, name){
  const cap = await dlCapP;
  if (cap){ await cap.save({ filename: name, data: blob }); return; }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
async function download(type, q){
  busy(true); await new Promise(r => setTimeout(r, 30));
  try {
    const blob = await makeBlob(type, q);
    busy(false);
    await saveBlob(blob, fileName(type === 'jpg' ? 'jpg' : 'png')); toast('İndirildi ✓');
  } catch (err){ busy(false); toast(err && err.code === 'declined' ? 'İndirme iptal edildi' : 'İndirme başarısız oldu'); console.error(err); }
}
$('#dlGo').onclick = () => { dlMenu.classList.remove('open'); download(dlType, dlQ); };
$('#shareBtn').onclick = async () => {
  busy(true);
  try {
    const blob = await makeBlob('png', 'norm'); const file = new File([blob], fileName('png'), { type: 'image/png' });
    busy(false);
    if (navigator.canShare && navigator.canShare({ files: [file] })){ await navigator.share({ files: [file], title: S.docName || 'Afiş' }); }
    else { await download('png', 'norm'); toast('Bu tarayıcı paylaşımı desteklemiyor, görsel indirildi'); }
  } catch (err){ busy(false); if (err && err.name !== 'AbortError') toast('Paylaşılamadı'); }
};

/* ---------- Yakınlaştırma ---------- */
const zr = $('#zoom');
zr.addEventListener('input', () => { zoom = zr.value / 100; $('#zoomLbl').textContent = '%' + zr.value; requestRender(); });
$('#fitBtn').onclick = () => { zr.value = 100; zoom = 1; $('#zoomLbl').textContent = '%100'; requestRender(); };

/* ---------- Toast ---------- */
let tt; function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2000); }

/* ---------- Başlat ---------- */
loadLogo();
setPanelOpen(panelOpen);
renderPanel(true);
commit();
const TR = 'İıŞşĞğÜüÖöÇç₺ AaBb0123';
Promise.all(['700 40px Oswald', '600 40px Oswald', '500 40px Oswald', '500 40px Montserrat', '600 40px Montserrat', '700 40px Montserrat', '800 40px Montserrat', '900 40px Montserrat', 'italic 800 40px Montserrat', 'italic 900 40px Montserrat',
  '800 40px "Playfair Display"', '700 40px "Playfair Display"', 'italic 400 40px "Playfair Display"', 'italic 700 40px "Playfair Display"', '700 40px Nunito', '800 40px Nunito', '900 40px Nunito']
  .map(f => document.fonts.load(f, TR).catch(() => {})))
  .then(() => { requestRender(); refreshThumbs(); });
document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', () => { requestRender(); refreshThumbsLater(); });
requestRender();
</script>
</body>
</html>
